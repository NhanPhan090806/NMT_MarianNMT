[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-assignment"
version = "0.1.0"
description = "Generative SQuAD experiments with attention, Mamba, and T5"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<3",
    "transformers>=4.57.1,<6",
    "sentencepiece>=0.2,<0.3",
    "numpy>=1.26,<3",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

